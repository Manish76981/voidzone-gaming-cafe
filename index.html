    /* ==========================================================================
       VOIDZONE v12.0 — CENTRAL MOTION TOKEN SYSTEM & UNIFIED INTERACTION ENGINE

    :root {

      --vz-glow-none: none;
      --vz-glow-subtle: 0 0 12px -3px rgba(var(--tab-tint-rgb, 255, 107, 0), 0.22);
      --vz-glow-medium: 0 0 18px -2px rgba(var(--tab-tint-rgb, 255, 107, 0), 0.34);
      --vz-glow-featured: 0 0 26px -2px rgba(var(--tab-tint-rgb, 255, 107, 0), 0.48);

      --motion-tab-dir: 1;
    }

    .perspective-stage {
      perspective: none !important;
      transform-style: flat !important;
    }

    #app {
      transform-style: flat !important;
      will-change: opacity, transform;
    }

    .stagger-home-cards > .c,
    .stagger-home-cards > .g > .c,
    .stagger-home-cards > .g2 > .c,
    main#app.vz-in .c,
    .tab-cards-reveal .c {

    /* Direction-Aware, Interruptible Tab & Page Transition (Sections 10, 11, 12, 15) */
    @keyframes vzMotionTabEnter {

    nav#nav.vz-frosted-tabbar.has-liquid-lens .vz-liquid-lens {

    /* Consistent Card Interaction System (Section 6: No 3D rotation or continuous pulse) */
    main#app .c {

        transform var(--motion-duration-standard) var(--motion-ease-enter) !important;
    }

    @media (hover: hover) {
      main#app .c:not(:has(input:focus, select:focus, textarea:focus)):hover {

    }

    /* Button Motion: Subtle, Immediately Responsive Feedback (Section 5) */
    .b,
    .b.o,
    .b.gold,
    .step-pill,
    .vz-hdr-btn {

        transform var(--motion-duration-fast) var(--motion-ease-enter),
        background var(--motion-duration-fast) var(--motion-ease-standard),
        border-color var(--motion-duration-fast) var(--motion-ease-standard),
        box-shadow var(--motion-duration-fast) var(--motion-ease-standard),
        color var(--motion-duration-micro) var(--motion-ease-standard),
        opacity var(--motion-duration-fast) var(--motion-ease-standard) !important;
    }

    .b:hover:not(:disabled):not(.vz-glass-tab),
    .b.o:hover:not(:disabled):not(.vz-glass-tab),
    .b.gold:hover:not(:disabled):not(.vz-glass-tab),
    .step-pill:hover:not(:disabled) {
      transform: translate3d(0, calc(-1 * var(--motion-distance-micro)), 0) !important;
    }

    .b:active:not(:disabled),
    .step-pill:active:not(:disabled),
    .vz-hdr-btn:active:not(:disabled),

    }

    /* Symmetrical Modal & Drawer Transitions (Sections 16 & 17) */
    @keyframes vzBackdropFadeIn {

    .drawer-backdrop {

    }

    @media (min-width: 768px) {

      }

        transform var(--motion-duration-standard) var(--motion-ease-enter) !important;
    }

    /* Skeleton / Stable Loading State (Section 20) */
    @keyframes vzSubtlePulse {

    }

    .vz-skeleton-loader {

    /* Comprehensive Reduced-Motion Compliance (Section 26) */
    @media (prefers-reduced-motion: reduce) {

      *::before,

        transition-duration: 0.01ms !important;

    /* ==========================================================================

    /* Hide the 4 combined tabs (Social, Creators, Collab, Esports) inside the top main dock

    /* ==========================================================================

    :root {

      --type-label: 0.6875rem;
      --type-button: 0.84375rem;

      /* Section 8: Coherent Spacing Scale (4px..96px) */
      --space-1: 4px;

      --space-4: 16px;

      --surface-base: #06070b;

      --surface-featured: linear-gradient(145deg, rgba(26, 17, 21, 0.92) 0%, rgba(12, 15, 22, 0.95) 100%);

    :root {

      }
      return state;
    }

    let S;
    try {
      const rawStored = localStorage.getItem(KEY) || localStorage.getItem("gk1");
      S = validateAndHydrateState(rawStored ? JSON.parse(rawStored) : null);
    } catch (e) {
      S = getDefaultState();
    }

    const now = () => Date.now() + S.skew * 6e4;
    const day = (ts = now()) => new Date(ts).toDateString();

    function syncRollovers() {
      const currentDay = day();
      if (S.gd !== currentDay) {
        S.given = 0;
        S.gd = currentDay;
        S.book = S.book.filter((b) => b.day === currentDay);
      }
      const mKey = currentMonthKey(now());
      if (S.monthlyDropPool.monthKey !== mKey) {
        S.monthlyDropPool.monthKey = mKey;
        S.monthlyDropPool.usedBudget = 0;
        S.monthlyDropPool.skinsRemaining = S.monthlyDropPool.skinsQuota;
      }
    }
    syncRollovers();

    const save = () => {
      try {
        const serialized = JSON.stringify(S);
        localStorage.setItem(KEY, serialized);
        localStorage.setItem("gk1", serialized);
      } catch (e) {}
    };

    /**
     * ============================================================================
     * iCafeCloud (iCafe8 v2 REST) & CCBoot Diskless Integration Bridge (`CafeBridge`)
     * ============================================================================
     * Maps VoidZone player profiles, wallet top-ups, bonus Happy-Hour minutes, and

    const CafeBridge = {
      mapMemberToICafePayload(phone, c) {

          member_group_name: tObj.name,

          member_bonus_minutes: Number(c.pass || 0),

        };
      },

      mapMemberToCCBootRecord(phone, c) {
        const tObj = tierObjOf(c);
        return {
          UserName: c.member_account || sanitizeMemberAccount(c.n, phone),
          Phone: phone,
          FullName: c.n,

          FreeMinutes: Number(c.pass || 0),
          RiotID: c.riot_id || "",

        };
      },

      enqueue(eventType, endpoint, phone, payload) {
        if (!Array.isArray(S.syncQueue)) S.syncQueue = [];
        const c = S.cust[phone];
        const item = {
          id: "SYNC-" + (1000 + S.syncQueue.length + Math.floor(secureRandom() * 8999)),
          ts: new Date(now()).toISOString(),
          eventType,
          protocol: "iCafeCloud v2 + CCBoot",
          endpoint,
          memberAccount: c?.member_account || payload?.member_account || "guest",
          phone: phone || "-",
          status: S.bridgeCfg?.autoSync ? "SYNCED" : "QUEUED",
          attempts: 1,
          payload
        };
        S.syncQueue.unshift(item);
        if (S.syncQueue.length > 100) S.syncQueue = S.syncQueue.slice(0, 100);
        if (S.bridgeCfg) S.bridgeCfg.lastSyncAt = now();
        return item;

      enqueueMemberUpsert(phone) {
        const c = S.cust[phone];
        if (!c) return null;
        const cafeId = S.bridgeCfg?.cafeId || "VZ-MAZGAON-101";
        return this.enqueue(
          "MEMBER_UPSERT",
          `POST /api/v2/cafe/${cafeId}/members`,
          phone,
          {
            icafe_v2: this.mapMemberToICafePayload(phone, c),
            ccboot_xmlrpc: this.mapMemberToCCBootRecord(phone, c)
          }
        );

      enqueueTopup(phone, amount, bonusMins = 0, payMethod = "cash", comment = "Desk Top-up") {
        const c = S.cust[phone];

          "WALLET_TOPUP",
          `POST /api/v2/cafe/${cafeId}/members/${memberId}/topup`,
          phone,
          {
            member_id: memberId,
            member_account: c.member_account,

      enqueuePcLogin(rigId, phone, durationMins = 60, prepaidInr = 0) {

          phone,
          {
            pc_name: rigId,
            ccboot_client_ip: `192.168.1.${100 + RIGS.findIndex((r) => r[0] === rigId)}`,
            member_account: c?.member_account || sanitizeMemberAccount(c?.n, phone),
            member_phone: phone,
            duration_minutes: durationMins,
            free_pass_minutes_available: c?.pass || 0,
            prepaid_inr: prepaidInr
          }

      buildICafeCsv() {
        const cols = [
          "member_id",
          "member_account",
          "member_name",

        ];
        const rows = Object.entries(S.cust).map(([phone, c]) => {
          const tObj = tierObjOf(c);
          return [
            c.icafeMemberId || "",
            c.member_account || sanitizeMemberAccount(c.n, phone),
            c.n || "",
            phone,
            c.email || "",
            c.riot_id || "",
            tObj.name,
            c.w || 0,
            c.pass || 0,
            c.shards || 0,
            c.drops || 0,
            c.kycVerified ? "YES" : "NO",
            c.pinHash || ""
          ]
            .map(sanitizeCsvCell)
            .join(",");
        });
        return [cols.join(","), ...rows].join("\n");
      },

      buildCCBootJson() {
        return JSON.stringify(
          {
            server: S.bridgeCfg?.ccbootServerIp || "192.168.1.250:8001",
            cafe_id: S.bridgeCfg?.cafeId || "VZ-MAZGAON-101",
            exported_at: new Date(now()).toISOString(),
            users: Object.entries(S.cust).map(([phone, c]) => this.mapMemberToCCBootRecord(phone, c))
          },
          null,
          2
        );
      },

      getSqlSchemaDDL() {
        return `-- VoidZone Gaming Lounge (Mazgaon & Charni Road) — Production SQL Schema

    /**
     * ============================================================================
     * Dual-Layer Database Repository (`DBAdapter`)
     * ============================================================================
     * Abstracts all persistence reads/writes behind async-compatible repository methods
     * with automatic fallback to localStorage (`vz_mazgaon_v1` + `gk1`).
     */
    const DB = {
      findByAccountOrPhone(identifier) {
        const raw = String(identifier || "").trim();
        if (!raw) return null;
        // 1. Check phone digits (supports 10-digit or +91 prefix)
        const digits = raw.replace(/\D/g, "");
        const last10 = digits.length >= 10 ? digits.slice(-10) : "";
        if (last10 && S.cust[last10]) {
          return { phone: last10, customer: S.cust[last10] };
        }
        // 2. Strip leading '@' and compare against member_account, name, or base username
        const lower = raw.replace(/^@+/, "").toLowerCase();
        for (const [p, c] of Object.entries(S.cust)) {
          const acct = String(c.member_account || "").replace(/^@+/, "").toLowerCase();
          const baseAcct = acct.replace(/_vz$/, "");
          const fullName = String(c.n || "").trim().toLowerCase();
          if (acct === lower || baseAcct === lower || fullName === lower) {
            return { phone: p, customer: c };
          }
        }
        return null;
      },

      isUsernameTaken(username, excludePhone = null) {
        const target = sanitizeMemberAccount(username);
        for (const [p, c] of Object.entries(S.cust)) {
          if (excludePhone && p === excludePhone) continue;
          if ((c.member_account || "").toLowerCase() === target.toLowerCase()) return true;
        }
        return false;
      },

      createMember({ phone, username, name, email = "", riotId = "", pin = "0000", kycVerified = false, kycDoc = "" }) {
        const cleanPhone = String(phone || "").trim();
        const cleanName = String(name || "").trim().slice(0, 40);
        const cleanPin = String(pin || "").trim();
        const cleanAcct = sanitizeMemberAccount(username || `${cleanName}_vz`, cleanPhone);

        if (!/^\d{10}$/.test(cleanPhone)) {
          return { ok: false, error: "Enter a valid 10-digit mobile number." };
        }
        if (!cleanName || cleanName.length < 2) {
          return { ok: false, error: "Enter your full name (at least 2 characters)." };
        }
        if (!/^[a-z0-9_.-]{3,24}$/.test(cleanAcct)) {
          return { ok: false, error: "GamerTag / Username must be 3–24 alphanumeric characters." };
        }
        if (!/^\d{4,6}$/.test(cleanPin)) {
          return { ok: false, error: "PIN must be 4 to 6 digits." };
        }
        if (S.cust[cleanPhone]) {
          return { ok: false, error: `Phone ${cleanPhone} is already registered (@${S.cust[cleanPhone].member_account}). Please Sign In.` };
        }
        if (this.isUsernameTaken(cleanAcct)) {
          return { ok: false, error: `GamerTag @${cleanAcct} is already taken. Choose another username.` };
        }

        const salt = `vz_${cleanPhone}_${Date.now() % 10000}`;
        const memberCount = Object.keys(S.cust).length + 1001;
        const record = {
          n: cleanName,
          member_account: cleanAcct,
          member_phone: cleanPhone,
          email: String(email || "").trim().slice(0, 80),
          riot_id: String(riotId || "").trim().slice(0, 40),
          pin: cleanPin,
          pinSalt: salt,
          pinHash: hashPin(cleanPin, salt),
          kycVerified: Boolean(kycVerified),
          kycDoc: kycDoc ? String(kycDoc).slice(0, 60) : kycVerified ? "Staff Desk KYC Verified" : "Pending Desk KYC",
          icafeMemberId: `ICF-${memberCount}`,
          createdAt: new Date(now()).toISOString(),
          w: 0,
          v: 0,
          h: 0,
          sp: 1, // Welcome bonus: +1 Free Cyber Spin on registration!
          st: 0,
          pass: 0,
          sh: 0,
          cp: 0,
          vo: [],
          drops: 0,
          shards: 0,
          wkMins: 0,
          weeksCompleted: 0,
          passTier: "none",
          passExp: 0
        };

        S.cust[cleanPhone] = record;
        if (!Array.isArray(S.customerDatabase)) S.customerDatabase = [];
        if (!S.customerDatabase.some(c => c.phone === cleanPhone)) {
          S.customerDatabase.push({ name: cleanName, phone: cleanPhone, tier: "Non-Member" });
        }
        CafeBridge.enqueueMemberUpsert(cleanPhone);
        save();
        // Background Edge D1 sync (non-blocking)
        fetch("/api/auth", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "signup", phone: cleanPhone, member_account: cleanAcct, username: cleanAcct, name: cleanName, pin: cleanPin, email, riot_id: riotId, riotId })
        }).catch(() => {});
        return { ok: true, phone: cleanPhone, customer: record };
      },

      updateBalance(phone, deltaInr, txType = "TOPUP", payMethod = "cash", note = "") {
        const c = S.cust[phone];
        if (!c) return { ok: false, error: "Member not found." };
        const d = Math.round(Number(deltaInr) || 0);
        c.w = Math.max(0, (c.w || 0) + d);
        if (!Array.isArray(S.walletsLedger)) S.walletsLedger = [];
        S.walletsLedger.push({
          txId: "TX-" + (Date.now() % 100000),
          ts: new Date(now()).toISOString(),
          phone,
          member_account: c.member_account,
          delta: d,
          balanceAfter: c.w,
          txType,
          payMethod,
          note
        });
        if (d > 0) {
          CafeBridge.enqueueTopup(phone, d, 0, payMethod, note || txType);
        } else {
          CafeBridge.enqueueMemberUpsert(phone);
        }
        save();
        return { ok: true, balance: c.w };
      },

      startSession(rigId, sessionData) {
        S.rigs[rigId] = sessionData;
        const estMins = sessionData.e && sessionData.e > sessionData.s
          ? Math.round((sessionData.e - sessionData.s) / 60000)
          : 60;
        CafeBridge.enqueuePcLogin(rigId, sessionData.c, estMins, sessionData.prepaid || 0);
        save();
      },

      syncExternal() {
        if (!Array.isArray(S.syncQueue)) S.syncQueue = [];
        let flushed = 0;
        S.syncQueue.forEach((item) => {
          if (item.status !== "SYNCED") {
            item.status = "SYNCED";
            item.attempts = (item.attempts || 0) + 1;
            flushed++;
          }
        });
        if (S.bridgeCfg) {
          S.bridgeCfg.lastSyncAt = now();
          S.bridgeCfg.connStatus = `SYNCED (${S.syncQueue.length} RECORDS MIRRORED TO iCAFE8 & CCBOOT)`;
        }
        save();
        return flushed;
      }
    };

    function getTotalOpex() {
      const ox = S.opex;
      return (ox.rent || 0) + (ox.electricity || 0) + (ox.internet || 0) + (ox.staff || 0) + (ox.coolerStock || 0) + (ox.maintMisc || 0);
    }

    function recalcEconomyBounds() {
      S.cfg.pct = clampRewardPct(S.cfg.pct);
      const ec = S.economy;
      const totalGrossRev = ec.realizedPlayRev + ec.realizedFoodRev + ec.realizedPassRev;
      const totalOpex = getTotalOpex();
      ec.realizedNetProfit = Math.max(1000, Math.round(totalGrossRev - totalOpex));
      S.cfg.np = ec.realizedNetProfit;

      const totalAllowedPool = ec.realizedNetProfit * (S.cfg.pct / 100);
      const maxSpinPool = totalAllowedPool * 0.70;
      const maxEscrowPool = totalAllowedPool * 0.30;

      ec.totalHardSpent = +(ec.spinHardSpent + ec.escrowHardSpent).toFixed(2);
      ec.spinReserve = Math.max(0, +(maxSpinPool - ec.spinHardSpent).toFixed(2));
      ec.skinEscrow = Math.max(0, +(maxEscrowPool - ec.escrowHardSpent).toFixed(2));
      ec.reservePool = +(ec.spinReserve + ec.skinEscrow).toFixed(2);
      S.monthlyDropPool.monthlyBudget = Math.round(maxEscrowPool);
      S.monthlyDropPool.usedBudget = Math.round(ec.escrowHardSpent);
      S.monthlyDropPool.monthlySkinsLeft = S.monthlyDropPool.skinsRemaining;
    }

    function accrueProfitToEconomy(playRev = 0, foodRev = 0, passRev = 0) {
      const ec = S.economy;
      ec.realizedPlayRev += Math.max(0, Number(playRev) || 0);
      ec.realizedFoodRev += Math.max(0, Number(foodRev) || 0);
      ec.realizedPassRev += Math.max(0, Number(passRev) || 0);
      recalcEconomyBounds();
    }

    function recordRewardSpend(bucket, hardCost, perceivedVal = 0) {
      const ec = S.economy;
      const cost = Math.max(0, Number(hardCost) || 0);
      const pVal = Math.max(0, Number(perceivedVal) || 0);
      if (bucket === "escrow") {
        ec.escrowHardSpent = +(ec.escrowHardSpent + cost).toFixed(2);
      } else if (bucket === "spin" && cost > 0) {
        ec.spinHardSpent = +(ec.spinHardSpent + cost).toFixed(2);
        S.given = +(S.given + cost).toFixed(2);
      }
      ec.totalPerceivedGiven = Math.round(ec.totalPerceivedGiven + pVal);
      recalcEconomyBounds();
    }

    const cap = () => {
      const monthlySpinPool = S.economy.realizedNetProfit * (S.cfg.pct / 100) * 0.70;
      const dailyPace = Math.max(15, monthlySpinPool / 30);
      return Math.max(1, Math.min(S.economy.spinReserve + S.given, dailyPace));
    };

    function getWheelDynamicOdds(c = null) {
      recalcEconomyBounds();
      const ec = S.economy;
      const maxTotalAllowed = ec.realizedNetProfit * (S.cfg.pct / 100);
      const remainingGlobalCap = Math.max(0, maxTotalAllowed - ec.totalHardSpent);
      const dailyRem = Math.max(0, cap() - S.given);
      const availSpin = Math.min(ec.spinReserve, dailyRem, remainingGlobalCap);
      const targetThreshold = Math.max(50, cap() * 0.40);
      const scarcityRatio = availSpin < targetThreshold ? Math.max(0, availSpin / targetThreshold) : 1;
      const playerShards = c ? c.shards || 0 : 0;

      const prelim = WH.map((w) => {
        if (w.k === "vs") {
          const needsImmediateCraft = playerShards >= 2;
          if (S.monthlyDropPool.skinsRemaining <= 0) {
            return { ...w, rawWt: 0, status: "QUOTA LOCKED (0 Skins)" };
          }
          if (needsImmediateCraft && (ec.skinEscrow < 1500 || remainingGlobalCap < 1500)) {
            return { ...w, rawWt: 0, status: "3RD SHARD ESCROW LOCKED" };
          }
          if (ec.skinEscrow < 500) {
            const scale = Math.max(0, ec.skinEscrow / 500);
            return {
              ...w,
              rawWt: w.wt * scale,
              status: scale === 0 ? "ESCROW LOCKED" : `SCALED (${Math.round(scale * 100)}%)`
            };
          }
          return { ...w, rawWt: w.wt, status: "ESCROW READY" };
        }

        if (w.hardCost > 0) {
          if (w.hardCost > availSpin || w.hardCost > remainingGlobalCap) {
            return { ...w, rawWt: 0, status: "HARD LOCKED (Reserve)" };
          }
          if (scarcityRatio < 1) {
            return {
              ...w,
              rawWt: w.wt * scarcityRatio,
              status: `THROTTLED (${Math.round(scarcityRatio * 100)}%)`
            };
          }
          return { ...w, rawWt: w.wt, status: "UNLOCKED" };
        }

        return { ...w, rawWt: w.wt, status: "SAFE BUFFER (₹0 COGS)" };
      });

      const usedHardAndShardWt = prelim
        .filter((x) => x.hardCost > 0 || x.k === "vs")
        .reduce((s, x) => s + x.rawWt, 0);
      const baseZeroWt = prelim
        .filter((x) => x.hardCost === 0 && x.k !== "vs")
        .reduce((s, x) => s + x.wt, 0);
      const targetZeroMass = Math.max(0, 100 - usedHardAndShardWt);

      const finalSlices = prelim.map((x) => {
        let effWt = x.rawWt;
        if (x.hardCost === 0 && x.k !== "vs" && baseZeroWt > 0) {
          effWt = (x.wt / baseZeroWt) * targetZeroMass;
        }
        return {
          ...x,
          effWt: Math.max(0, effWt),
          livePct: Math.max(0, effWt)
        };
      });

      const totalLive = finalSlices.reduce((s, x) => s + x.livePct, 0) || 100;
      return finalSlices.map((x) => {
        const normPct = +((x.livePct / totalLive) * 100).toFixed(2);
        return {
          ...x,
          effectiveWeight: normPct,
          livePct: normPct
        };
      });
    }

    function getDropDynamicOdds(c = null) {
      recalcEconomyBounds();
      const ec = S.economy;
      const pool = S.monthlyDropPool;
      const tObj = tierObjOf(c);
      const bonusWt = tObj.dropBonusWt || 0;
      const maxTotalAllowed = ec.realizedNetProfit * (S.cfg.pct / 100);
      const remainingGlobalCap = Math.max(0, maxTotalAllowed - ec.totalHardSpent);
      const availEscrow = Math.min(ec.skinEscrow, remainingGlobalCap);
      const dropThreshold = 600;
      const scarcityRatio = availEscrow < dropThreshold ? Math.max(0, availEscrow / dropThreshold) : 1;
      const playerShards = c ? c.shards || 0 : 0;

      const prelim = DROP_LOOT.map((item) => {
        const boostedBase = item.wt + (item.isHighTier ? bonusWt : 0);

        if (item.id === "valo_skin") {
          if (pool.skinsRemaining <= 0) {
            return { ...item, boostedBase, rawWt: 0, status: "QUOTA LOCKED (0 Left)" };
          }
          if (availEscrow < 1500) {
            return {
              ...item,
              boostedBase,
              rawWt: 0,
              status: `ESCROW LOCKED (${rs(availEscrow)}/₹1,500)`
            };
          }
          return { ...item, boostedBase, rawWt: boostedBase, status: "ESCROW UNLOCKED" };
        }

        if (item.id === "valo_shard") {
          if (pool.skinsRemaining <= 0) {
            return { ...item, boostedBase, rawWt: 0, status: "QUOTA LOCKED" };
          }
          if (playerShards >= 2 && availEscrow < 1500) {
            return {
              ...item,
              boostedBase,
              rawWt: 0,
              status: `3RD SHARD LOCKED (${rs(availEscrow)}/₹1,500)`
            };
          }
          if (availEscrow < 500) {
            const scale = Math.max(0, availEscrow / 500);
            return {
              ...item,
              boostedBase,
              rawWt: boostedBase * scale,
              status: scale === 0 ? "ESCROW LOCKED" : `SCALED (${Math.round(scale * 100)}%)`
            };
          }
          return { ...item, boostedBase, rawWt: boostedBase, status: "UNLOCKED" };
        }

        if (item.hardCost > 0) {
          if (item.hardCost > availEscrow) {
            return { ...item, boostedBase, rawWt: 0, status: "HARD LOCKED (Escrow)" };
          }
          if (scarcityRatio < 1) {
            return {
              ...item,
              boostedBase,
              rawWt: boostedBase * scarcityRatio,
              status: `THROTTLED (${Math.round(scarcityRatio * 100)}%)`
            };
          }
          return { ...item, boostedBase, rawWt: boostedBase, status: "UNLOCKED" };
        }

        return { ...item, boostedBase, rawWt: boostedBase, status: "SAFE BUFFER (₹0 COGS)" };
      });

      const totalBoostedBase = prelim.reduce((s, x) => s + x.boostedBase, 0) || 100;
      const usedNonZeroWt = prelim
        .filter((x) => x.hardCost > 0 || x.id === "valo_shard")
        .reduce((s, x) => s + x.rawWt, 0);
      const baseZeroWt = prelim
        .filter((x) => x.hardCost === 0 && x.id !== "valo_shard")
        .reduce((s, x) => s + x.boostedBase, 0);
      const targetZeroMass = Math.max(0, totalBoostedBase - usedNonZeroWt);

      const finalItems = prelim.map((x) => {
        let effWt = x.rawWt;
        if (x.hardCost === 0 && x.id !== "valo_shard" && baseZeroWt > 0) {
          effWt = (x.boostedBase / baseZeroWt) * targetZeroMass;
        }
        return {
          ...x,
          basePct: +((x.boostedBase / totalBoostedBase) * 100).toFixed(2),
          effWt: Math.max(0, effWt)
        };
      });

      const totalEff = finalItems.reduce((s, x) => s + x.effWt, 0) || 1;
      return finalItems.map((x) => {
        const normPct = +((x.effWt / totalEff) * 100).toFixed(2);
        return {
          ...x,
          effectiveWeight: normPct,
          livePct: normPct
        };
      });
    }

     * VoidZone Pricing Engine:
     * - Happy Hours: 10:00 AM – 2:00 PM (PC ₹60/hr, PS5 ₹80/hr per controller, Racing Sim ₹150/hr)
     * - Peak Hours: 2:00 PM onwards (PC ₹80/hr, PS5 ₹100/hr per controller, Racing Sim ₹200/hr)
     * - Group Discounts (from VoidZone Rate Board):
     *   - PC Group of 10 Gamers: ₹70/hr during peak (₹60/hr during Happy Hour)
     *   - PS5 Group of 4 Controllers (`k === 4` or `grp`): ₹80/hr per controller during peak
     * - Racing Simulator VR2 Add-on (`vr2 === true`): +₹50/hr
     */
    function price(t, s, m, k, free, vr2 = false, grp = false) {
      let c = 0;
      let u = 0;
      const blocks = Math.max(1, Math.ceil(m / 15));
      const controllers = t === "ps" ? Math.min(4, Math.max(1, Number(k) || 1)) : 1;
      for (let i = 0; i < blocks; i++) {
        const h = new Date(s + i * 9e5).getHours();
        const hh = h >= HH[0] && h < HH[1];
        if (hh && free - u >= 15) {
          u += 15;
          continue;
        }
        let hourlyRate = RATE[t][hh ? 1 : 0];
        if (!hh) {
          if (t === "pc" && grp) hourlyRate = 70; // Group of 10 PCs @ ₹70/hr
          if (t === "ps" && (controllers >= 4 || grp)) hourlyRate = 80; // Group of 4 Console Gamers @ ₹80/hr
        }
        if (t === "sim" && vr2) {
          hourlyRate += 50; // +₹50/hr with VR2
        }
        c += (hourlyRate / 4) * controllers;
      }
      return [c, u];
    }

      const optInDisc = Boolean(r && r.applyDisc);
      const tObj = optInDisc ? tierObjOf(c) : TIERS[0];
      const ty = RIG_MAP[id] || "pc";
      const effectiveEndTs = r.e && r.e > r.s ? r.e : now();
      const rawElapsedMs = Math.max(0, effectiveEndTs - r.s);
      const m = Math.max(15, Math.ceil(rawElapsedMs / 9e5) * 15);
      const [g, u] = price(ty, r.s, m, r.k, optInDisc ? (c.pass || 0) : 0, r.vr2, r.grp);
      const d = optInDisc ? (g * tObj.playDisc) : 0;

      const usedWheelCoupon = optInDisc && rawFood > 0 && (c.cp || 0) > 0;
      const foodDiscRate = optInDisc ? (usedWheelCoupon ? 0.20 : tObj.foodDisc) : 0;
      const foodDiscAmt = Math.round(rawFood * foodDiscRate);
      const netFood = Math.max(0, rawFood - foodDiscAmt);

      const grossTotal = netPlay + netFood;
      const prepaidUsed = Math.min(grossTotal, r.prepaid || 0);

      const spinsEarned = Math.min(3, Math.floor(m / 60));
      const bonusPassEarned = m >= 180 ? 15 : 0;

      const dropsEarned = m >= 300 ? Math.max(1, Math.floor(projectedWkMins / 300)) : Math.floor(projectedWkMins / 300);

      return {
        m,
        g,
        d,
        netPlay,
        rawFood,
        foodDiscAmt,
        usedWheelCoupon,
        sn: netFood,
        u,
        prepaidUsed,

        tObj,
        spinsEarned,
        bonusPassEarned,
        dropsEarned
      };

    function ensureAdminAuthGatewayState() {
      if (!S.adminGateway || typeof S.adminGateway !== "object") {
        S.adminGateway = {
          currentSession: null, // { tokenHash, linkedMemberId, appUsername, ccbootOperatorId, cafeId, role, permissions, ccbootVerified, authMode, createdAt, expiresAt }
          sessionStore: [],     // DB-mirror of hashed session records (stores ONLY tokenHash, never raw token)
          bridge: {
            active: false,
            cafeId: "",
            activeOperators: [], // list of active tokenHashes sharing the CCBoot bridge
            health: "INACTIVE (Awaiting Staff/Admin CCBoot Login)",

          }
        };
      }
      if (!Array.isArray(S.adminGateway.sessionStore)) S.adminGateway.sessionStore = [];

        S.adminGateway.bridge = { active: false, cafeId: "", activeOperators: [], health: "INACTIVE", authorizedStationsCount: 0, lastVerifiedAt: "" };

    function getRoleHomeDestination() {
      if (hasValidAdminSession("developer") || devOk) return "developer";
      if (hasValidAdminSession("owner") || (ok && staffRole === "owner")) return "owner";
      if (hasValidAdminSession("staff") || (ok && staffRole === "staff")) return "staff";
      return "home";
    }

    function hasValidAdminSession(requiredRole = null) {
      const gw = ensureAdminAuthGatewayState();
      const sess = gw.currentSession;
      if (sess && sess.ccbootVerified === true && sess.accountLinked === true && sess.active === true && !sess.revoked) {
        const stored = gw.sessionStore.find((r) => r.tokenHash === sess.tokenHash && !r.revoked);
        if (stored) {
          if (!requiredRole) return true;
          // Strict RBAC Isolation (Section 5 Audit Fix): Developer cannot escalate to Owner; Staff cannot escalate to Owner
          if (requiredRole === "staff") return ["staff", "owner"].includes(sess.role);
          if (requiredRole === "owner") return sess.role === "owner";
          if (requiredRole === "developer") return sess.role === "developer";
        }
      }
      return false;
    }

    function activateOrReuseCcbootBridge(sessionRecord) {
      const gw = ensureAdminAuthGatewayState();
      const cb = ensureCcbootState();
      if (!gw.bridge.activeOperators.includes(sessionRecord.tokenHash)) {
        gw.bridge.activeOperators.push(sessionRecord.tokenHash);
      }
      gw.bridge.active = true;
      gw.bridge.cafeId = sessionRecord.cafeId || "7777";
      gw.bridge.authorizedStationsCount = (cb.pcs || []).length || 22;
      gw.bridge.lastVerifiedAt = new Date(now()).toISOString().replace("T", " ").slice(0, 19);
      gw.bridge.health = cb.operatingMode === "CCBOOT_INTEGRATION"
        ? "BRIDGE_ACTIVE (CCBoot Integration Mode · Shared)"
        : "BRIDGE_ACTIVE (Standalone Infrastructure Bridge · Shared)";
      logCcbootEvent(
        "BRIDGE_ACTIVATE_OR_REUSE",
        "OK",
        `Activated/reused shared CCBoot bridge for ${sessionRecord.ccbootOperatorId} (role=${sessionRecord.role}, active_sessions=${gw.bridge.activeOperators.length})`
      );
    }

    function authenticateCcbootFirst(cafeIdInput, operatorIdInput, passwordInput) {
      const gw = ensureAdminAuthGatewayState();
      const cafeId = String(cafeIdInput || "7777").trim();
      const opKey = String(operatorIdInput || "").trim().toLowerCase();
      const pass = String(passwordInput || "").trim();

      if (!cafeId || !opKey || !pass) {
        ccbootAuthError = "Step 1 Blocked: Enter your CCBoot Cafe ID, CCBoot Operator Identity, and Password.";
        logCcbootEvent("CCBOOT_LOGIN_FAIL", "ERROR", "Missing CCBoot operator credentials");
        return { ok: false, step: 1, error: ccbootAuthError };
      }

      // STEP 1 — CCBoot Login Verification
      const op = CCBOOT_OPERATOR_DIRECTORY[opKey];
      if (!op || op.cafeId !== cafeId || op.passSecret !== pass) {
        ccbootAuthError = "Step 1 Failed (CCBoot Authentication): Invalid CCBoot Operator ID, Cafe ID, or Password.";
        logCcbootEvent("CCBOOT_LOGIN_FAIL", "ERROR", `Failed Step 1 CCBoot verification for operator '${opKey}'`);
        return { ok: false, step: 1, error: ccbootAuthError };
      }

      // STEP 2 — Application Account & RBAC Verification (CCBoot alone never grants privileges)
      if (!op.isLinked || !op.linkedMemberId || op.assignedRole === "unlinked") {
        ccbootAuthError = "Step 2 Denied (Account Linking): CCBoot identity verified, but it is NOT linked to an authorized VoidZone application account.";
        logCcbootEvent("CCBOOT_ACCOUNT_UNLINKED", "ERROR", `Denied unlinked CCBoot identity '${opKey}'`);
        return { ok: false, step: 2, step1Verified: true, error: ccbootAuthError };
      }
      if (!op.active) {
        ccbootAuthError = "Step 2 Denied (Account Inactive): The linked VoidZone application account is inactive/suspended.";
        logCcbootEvent("CCBOOT_ACCOUNT_INACTIVE", "ERROR", `Denied inactive account '${op.linkedMemberId}'`);
        return { ok: false, step: 2, step1Verified: true, error: ccbootAuthError };
      }

      // STEP 3 — Secure Application Session Creation (Store ONLY tokenHash in sessionStore)
      const rawToken = "vzs_" + Math.floor(now()).toString(16) + "_" + Math.floor(secureRandom() * 1e9).toString(16);
      const tokenHash = hashPin(rawToken, "vz_session_token_salt_v8");
      const nowIso = new Date(now()).toISOString().replace("T", " ").slice(0, 19);
      const expiresIso = new Date(now() + 8 * 3600 * 1000).toISOString().replace("T", " ").slice(0, 19);

      const dbSessionRow = {
        tokenHash, // Raw token is NEVER stored in sessionStore
        linkedMemberId: op.linkedMemberId,
        appUsername: op.appUsername,
        ccbootOperatorId: op.ccbootOperatorId,
        cafeId: op.cafeId,
        role: op.assignedRole,
        permissions: [...op.permissions],
        ccbootVerified: true,
        accountLinked: true,
        active: true,
        authMode: "CCBOOT_GATEWAY_VERIFIED",
        revoked: false,
        createdAt: nowIso,
        expiresAt: expiresIso
      };
      gw.sessionStore.push(dbSessionRow);
      gw.currentSession = { ...dbSessionRow };

      // Sync legacy flags strictly from the verified DB-assigned role
      if (op.assignedRole === "staff") {
        ok = true;
        staffRole = "staff";
        devOk = false;
        staffLastActive = Date.now();
      } else if (op.assignedRole === "owner") {
        ok = true;
        staffRole = "owner";
        devOk = false;
        staffLastActive = Date.now();
        if (!S.staffSubTab || S.staffSubTab === "master_log") S.staffSubTab = "monthly_summary";
      } else if (op.assignedRole === "developer") {
        ok = false;
        staffRole = "none";
        devOk = true;
        devLastActive = Date.now();
      }

      // STEP 5 — Shared CCBoot Bridge Activation
      activateOrReuseCcbootBridge(dbSessionRow);

      // Dispatch non-blocking backend session sync to /api/auth
      fetch("/api/auth", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "ccboot_operator_login",
          cafe_id: cafeId,
          ccboot_operator_id: op.ccbootOperatorId,
          ccboot_password: pass
        })
      }).catch(() => {});

      // STEP 4 — Role-Based Dashboard Routing
      const targetView = op.assignedRole === "developer" ? "developer" : op.assignedRole === "owner" ? "owner" : "staff";
      ccbootAuthError = "";
      authDrawerOpen = false;
      save();
      go(targetView);
      toast(`✅ CCBoot Verified (${op.ccbootOperatorId}) → Routed to ${op.assignedRole.toUpperCase()} Dashboard`);
      return { ok: true, role: op.assignedRole, destination: targetView, tokenHash, bridgeActive: gw.bridge.active };
    }

    function logoutAdminSession() {
      const gw = ensureAdminAuthGatewayState();
      const curSess = gw.currentSession;
      if (curSess) {
        const stored = gw.sessionStore.find((r) => r.tokenHash === curSess.tokenHash);
        if (stored) stored.revoked = true;
        gw.bridge.activeOperators = gw.bridge.activeOperators.filter((h) => h !== curSess.tokenHash);
        logCcbootEvent(
          "CCBOOT_ADMIN_LOGOUT",
          "OK",
          `Revoked session ${curSess.tokenHash.slice(0, 10)} for ${curSess.ccbootOperatorId}. Active bridge sessions remaining: ${gw.bridge.activeOperators.length}`
        );
        fetch("/api/auth", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "logout", session_token: curSess.tokenHash })
        }).catch(() => {});
      }
      gw.currentSession = null;
      if (gw.bridge.activeOperators.length === 0) {
        gw.bridge.active = false;
        gw.bridge.health = "INACTIVE (All Admin Sessions Logged Out)";
      } else {
        gw.bridge.health = `BRIDGE_ACTIVE (Preserved for ${gw.bridge.activeOperators.length} other authorized session(s))`;
      }
      ok = false;
      staffRole = "none";
      devOk = false;
      cmsPreviewMode = false;
      sel = null;
      save();
      if (["staff", "owner", "developer"].includes(view)) {
        view = "home";
        if (location.hash.slice(1) !== "home") location.hash = "home";
      }
      render();
      toast("🔒 Signed out of Staff/Admin session and invalidated CCBoot operator context.");
    }

    function ensureCcbootState() {

        cms.ccboot = getDefaultCcbootState();
      }
      if (!Array.isArray(cms.ccboot.pcs) || cms.ccboot.pcs.length === 0) {
        cms.ccboot.pcs = getDefaultCcbootState().pcs;
      }
      if (!Array.isArray(cms.ccboot.gamesCatalog)) {
        cms.ccboot.gamesCatalog = getDefaultCcbootState().gamesCatalog;
      }
      if (!Array.isArray(cms.ccboot.logs)) {
        cms.ccboot.logs = getDefaultCcbootState().logs;
      }
      if (!cms.ccboot.features || typeof cms.ccboot.features !== "object") {
        cms.ccboot.features = getDefaultCcbootState().features;
      }
      return cms.ccboot;
    }

    function logCcbootEvent(event, status, detail) {
      const cb = ensureCcbootState();
      const nowIso = new Date(now()).toISOString().replace("T", " ").slice(0, 19);
      cb.logs.unshift({
        ts: nowIso,
        mode: cb.operatingMode || "STANDALONE",
        event,
        status,
        detail: String(detail || "").slice(0, 200)
      });
      if (cb.logs.length > 80) cb.logs = cb.logs.slice(0, 80);
    }

    function isStationInMaintenance(stationId) {
      const cb = ensureCcbootState();
      const rec = (cb.pcs || []).find((p) => p.stationId === stationId);
      return Boolean(rec && rec.maintenanceStatus !== "OPERATIONAL");
    }

      if (!code) return { valid: false, discountAmt: 0, reason: "" };
      const cms = ensureCmsState();
      const offer = (cms.offers || []).find((o) => String(o.code || "").toUpperCase() === code);
      if (!offer || !offer.active) {
        return { valid: false, discountAmt: 0, reason: `Promo code "${code}" is invalid or inactive.` };
      }
      const todayIso = new Date(now()).toISOString().slice(0, 10);
      if (offer.startDate && todayIso < offer.startDate) {
        return { valid: false, discountAmt: 0, reason: `Promo "${code}" starts on ${offer.startDate}.` };
      }
      if (offer.endDate && todayIso > offer.endDate) {
        return { valid: false, discountAmt: 0, reason: `Promo "${code}" expired on ${offer.endDate}.` };
      }
      if ((offer.usedCount || 0) >= (offer.usageLimit || 100)) {
        return { valid: false, discountAmt: 0, reason: `Promo "${code}" has reached its usage limit.` };
      }
      if (subtotalInr < (offer.minBill || 0)) {
        return { valid: false, discountAmt: 0, reason: `Promo "${code}" requires a minimum bill of ${rs(offer.minBill)}.` };
      }
      if (offer.eligibleService && offer.eligibleService !== "ALL" && offer.eligibleService !== serviceType) {
        return { valid: false, discountAmt: 0, reason: `Promo "${code}" is valid only on ${offer.eligibleService} bookings.` };
      }
      const rawDisc = offer.discountType === "FLAT"
        ? Number(offer.discountValue || 0)
        : Math.round(subtotalInr * (Number(offer.discountValue || 0) / 100));
      const cappedDisc = Math.min(subtotalInr, Math.min(rawDisc, Number(offer.maxDiscount || 99999)));
      return { valid: true, discountAmt: Math.max(0, cappedDisc), offer, reason: `Applied ${offer.code} (−${rs(cappedDisc)})` };
    }

    function swipeTab(direction = 1) {
      const tabIds = getAuthorizedNavTabIds();

      const curIdx = Math.max(0, tabIds.indexOf(view));
      const delta = direction >= 0 ? 1 : -1;
      // Strict first/last tab boundary clamping (no wrap-around)
      const nextIdx = Math.min(tabIds.length - 1, Math.max(0, curIdx + delta));
      const nextView = tabIds[nextIdx];
      if (nextView && nextView !== view) {
        go(nextView);

      return view;

      if (!target || typeof target.closest !== "function") return false;
      return Boolean(

      const dy = Number(endY) - Number(startY);
      if (!Number.isFinite(dx) || !Number.isFinite(dy)) return false;
      if (Math.abs(dx) < 60 || Math.abs(dx) <= Math.abs(dy) * 1.6) return false;

    // Rule-Based Brand <-> Creator Matching Engine (9 Transparent Criteria — Zero Fake AI)
    function computeCreatorCampaignMatch(creator, campaign) {
      let score = 0;
      const reasons = [];
      const games = creator.games || [];
      if (games.some((g) => g.toLowerCase() === String(campaign.game || "").toLowerCase()) || campaign.game === "Multi-Game") {
        score += 30;
        reasons.push(`Game Match (${campaign.game})`);
      }
      const plats = creator.platforms || [];
      if (plats.some((p) => String(campaign.platform || "").toLowerCase().includes(p.toLowerCase()))) {
        score += 20;
        reasons.push(`Platform Match (${campaign.platform})`);
      }
      if (String(creator.region || "").toLowerCase().includes("mumbai") && String(campaign.location || "").toLowerCase().includes("mazgaon")) {
        score += 15;
        reasons.push("Location Match (Mumbai / Mazgaon)");
      }
      if (String(creator.category || "").toLowerCase().includes("streamer") || String(creator.category || "").toLowerCase().includes("reel")) {
        score += 15;
        reasons.push("Creator Category Match");
      }
      if (creator.verificationStatus && creator.verificationStatus !== "Unverified") {
        score += 10;
        reasons.push(`Verified Status (${creator.verificationStatus})`);
      }
      if ((creator.reputation || 100) >= 120) {
        score += 10;
        reasons.push(`High Reputation (${creator.reputation} pts)`);
      }
      return { score: Math.min(100, score), reasons };
    }

    function fmtSlotTime(hVal, compactIfOnHour = false) {
      const totalMins = Math.round(Number(hVal) * 60);
      const h24 = ((Math.floor(totalMins / 60) % 24) + 24) % 24;
      const mins = ((totalMins % 60) + 60) % 60;
      const h12 = h24 % 12 || 12;
      const ampm = h24 < 12 ? "am" : "pm";
      if (compactIfOnHour && mins === 0) return `${h12}${ampm}`;
      return `${h12}:${String(mins).padStart(2, "0")}${ampm}`;
    }

    function hValToTimeStr(hVal) {
      if (hVal == null || !Number.isFinite(Number(hVal))) return "";
      const totalMins = Math.round(Number(hVal) * 60);
      const h24 = ((Math.floor(totalMins / 60) % 24) + 24) % 24;
      const mins = ((totalMins % 60) + 60) % 60;
      return `${String(h24).padStart(2, "0")}:${String(mins).padStart(2, "0")}`;
    }

    function timeStrToHVal(timeStr) {
      if (!/^\d{2}:\d{2}$/.test(String(timeStr || "").trim())) return null;
      const [hh, mm] = String(timeStr).trim().split(":").map(Number);
      let hVal = hh + mm / 60;
      // Treat 00:00 - 05:59 as late-night hours (12:00 AM - 2:00 AM operational window)
      if (hh < 6) hVal += 24;
      return hVal;
    }

    function fmtDurHours(dHours) {
      const totalMins = Math.max(15, Math.round(Number(dHours || 0) * 60));
      const hrs = Math.floor(totalMins / 60);
      const mins = totalMins % 60;
      if (hrs > 0 && mins > 0) return `${hrs}h ${mins}m (${totalMins}m)`;
      if (hrs > 0) return `${hrs}h (${totalMins}m)`;
      return `${mins}m`;
    }

    function hValToParts(hVal) {
      const totalMins = Math.round(Number(hVal ?? 13) * 60);
      const h24 = ((Math.floor(totalMins / 60) % 24) + 24) % 24;
      const mins = ((totalMins % 60) + 60) % 60;
      const snappedMin = Math.round(mins / 15) * 15 % 60;
      const ampm = h24 < 12 ? "AM" : "PM";
      const hr12 = h24 % 12 || 12;
      const isHH = h24 >= HH[0] && h24 < HH[1];
      return { hr12, mins: snappedMin, ampm, h24, isHH };
    }

    function partsToOpHour(hr12, mins, ampm, isEnd = false) {
      let h = Number(hr12) || 12;
      const m = Number(mins) || 0;
      const ap = String(ampm || "PM").toUpperCase();
      let h24 = h % 12;
      if (ap === "PM") h24 += 12;
      // VoidZone operates 10:00 AM (10) to 2:00 AM (26)
      // If AM is chosen: 10 AM and 11 AM are 10, 11; 12 AM, 1 AM, 2 AM are 24, 25, 26.
      if (ap === "AM") {
        if (h24 === 0 || h24 === 1 || h24 === 2) {
          h24 += 24;
        } else if (h24 < 10) {
          // Snap closed early-morning AM hours to 10:00 AM (start) or 12:00 AM (late night)
          h24 = isEnd ? 24 : 10;
        }
      }
      let opH = h24 + m / 60;
      if (!isEnd && opH >= 25.75) opH = 25.5;
      if (isEnd && opH > 26) opH = 26;
      return opH;
    }

    function getAvailableRigsInWindow(ty = bk.ty, startH = bk.h ?? 13, durH = bk.d || 2) {

          const bEnd = bStart + Math.round(Number(b.d) * 60);
          return bStart <= x && x < bEnd;
        }).length;
        mx = Math.max(mx, bookedCount);
      }
      return Math.max(0, capy - mx);
    }

    function applyBookingTimeWindow(startStr, endStr, silent = false) {
      let sH = timeStrToHVal(startStr);
      let eH = timeStrToHVal(endStr);
      if (sH == null) sH = bk.h != null ? bk.h : 13;
      if (sH < OPEN || sH >= 26) {
        if (!silent) toast("Start time must be within open hours (10:00 AM – 2:00 AM).");
        sH = Math.min(25, Math.max(OPEN, sH));
      }
      if (eH == null) eH = sH + (bk.d || 2);
      // If user picked e.g. 23:00 to 01:00, eH is already 25.0 via timeStrToHVal; if eH <= sH, bump or clamp
      if (eH <= sH) {
        if (eH + 24 <= 26 && eH + 24 > sH) {
          eH += 24;
        } else {
          if (!silent) toast("End time must be after Start time (minimum 15 mins). Auto-adjusted End time.");
          eH = Math.min(26, sH + Math.max(0.25, bk.d || 1));
        }
      }
      if (eH > 26) {
        if (!silent) toast("VoidZone closes at 2:00 AM. End time capped at 02:00 AM.");
        eH = 26;
      }
      const rawMins = Math.max(15, Math.round((eH - sH) * 60 / 5) * 5);
      const snappedStartMins = Math.round(sH * 60 / 5) * 5;
      const finalStartH = snappedStartMins / 60;
      const finalDurH = Number((rawMins / 60).toFixed(2));
      const finalEndH = finalStartH + finalDurH;

      bk.h = finalStartH;
      bk.d = finalDurH;
      bk.startTime = hValToTimeStr(finalStartH);
      bk.endTime = hValToTimeStr(finalEndH);
    }

    function slotsFor(stepOverride = bk.step) {
      const ty = bk.ty;
      const stepMins = [5, 10, 15].includes(Number(stepOverride)) ? Number(stepOverride) : 15;
      const capy = RIGS.filter((r) => r[1] === ty).length;
      const currentDay = day();
      const curNow = new Date(now());
      const curTotalMins = curNow.getHours() * 60 + curNow.getMinutes();
      const durMins = bk.d * 60;

      // If current time is late night (e.g. 1am), show full day starting 10:00 AM so user can book upcoming slots
      const effectiveCurMins = curTotalMins < OPEN * 60 ? OPEN * 60 - 10 : curTotalMins;
      const earliestMin = Math.max(OPEN * 60, Math.ceil((effectiveCurMins + 5) / stepMins) * stepMins);
      const closeMin = 24 * 60; // 12:00 AM midnight cutoff for self-serve slot picker

      const todaysBookings = S.book.filter((b) => b.ty === ty && b.day === currentDay && !b.seated);
      const activeRigCount = RIGS.filter((r) => r[1] === ty && S.rigs[r[0]]).length;

      const out = [];
      for (let m = earliestMin; m + durMins <= closeMin; m += stepMins) {
        let mx = 0;
        for (let x = m; x < m + durMins; x += 5) {
          const bookedCount = todaysBookings.filter((b) => {
            const bStart = Math.round(Number(b.h) * 60);
            const bEnd = bStart + Math.round(Number(b.d) * 60);
            return bStart <= x && x < bEnd;
          }).length;
          const floorOverlap = x < curTotalMins + 60 && curTotalMins >= OPEN * 60 ? activeRigCount : 0;
          mx = Math.max(mx, bookedCount + floorOverlap);
        }
        out.push([m / 60, Math.max(0, capy - mx), m]);
      }
      return out;
    }

    function estBreakdown(hour = bk.h, phoneForDiscount = bk.phone) {
      const c = (bk.applyDisc && phoneForDiscount) ? S.cust[phoneForDiscount] : null;
      const tObj = (bk.applyDisc && c) ? tierObjOf(c) : TIERS[0];
      const systemsCount = getSelectedSystemsCount();
      const controllers = bk.ty === "ps" ? Math.min(4, Math.max(1, Number(bk.k) || 1)) : 1;
      const totalMins = bk.d * 60;
      const freePassMins = (bk.applyDisc && c) ? (c.pass || 0) : 0;

      const vrAddon = bk.ty === "sim" && bk.vr2 ? 50 : 0;
      const hhHourly = RATE[bk.ty][1] + vrAddon;
      let peakHourly = RATE[bk.ty][0] + vrAddon;
      if (bk.ty === "pc" && bk.grp) peakHourly = 70;
      if (bk.ty === "ps" && (controllers >= 4 || bk.grp)) peakHourly = 80;

      const hhBase = hhHourly * bk.d * controllers * systemsCount;
      const peakBase = peakHourly * bk.d * controllers * systemsCount;
      const hhFinal = Math.round(hhBase * (1 - tObj.playDisc));
      const peakFinal = Math.round(peakBase * (1 - tObj.playDisc));

      if (hour == null) {
        return {
          hasSlot: false,
          c,
          tObj,
          controllers,
          totalMins,
          baseCost: peakBase,
          passUsedMins: 0,
          passSaved: 0,
          afterPassCost: peakBase,
          discRate: tObj.playDisc,
          discSaved: Math.round(peakBase * tObj.playDisc),
          finalCost: peakFinal,
          hhFinal,
          peakFinal,
          hhHours: 0,
          peakHours: bk.d
        };
      }

      const startTotMins = Math.round(Number(hour) * 60);
      const d = new Date(now());
      d.setHours(Math.floor(startTotMins / 60), startTotMins % 60, 0, 0);
      const [singleBaseCost] = price(bk.ty, +d, totalMins, controllers, 0, bk.vr2, bk.grp);
      const [singleAfterPassCost, passUsedMins] = price(bk.ty, +d, totalMins, controllers, freePassMins, bk.vr2, bk.grp);
      const baseCost = singleBaseCost * systemsCount;
      const afterPassCost = singleAfterPassCost * systemsCount;
      const passSaved = Math.max(0, baseCost - afterPassCost);
      const discRate = tObj.playDisc;
      const discSaved = afterPassCost * discRate;
      const afterMemberCost = Math.max(0, Math.round(afterPassCost - discSaved));
      const promoEval = evaluatePromoOffer(bk.promoCode, afterMemberCost, bk.ty.toUpperCase());
      const promoSaved = promoEval.valid ? promoEval.discountAmt : 0;
      const finalCost = Math.max(0, afterMemberCost - promoSaved);

      let hhBlocks = 0;
      let peakBlocks = 0;
      let hhSliceCost = 0;
      let peakSliceCost = 0;
      const blocks = Math.max(1, Math.ceil(totalMins / 15));
      for (let i = 0; i < blocks; i++) {
        const h = new Date(+d + i * 9e5).getHours();
        if (h >= HH[0] && h < HH[1]) {
          hhBlocks++;
          hhSliceCost += (hhHourly / 4) * controllers * systemsCount;
        } else {
          peakBlocks++;
          peakSliceCost += (peakHourly / 4) * controllers * systemsCount;
        }
      }

      return {
        hasSlot: true,
        c,
        tObj,
        systemsCount,
        perSystemCost: Math.round(finalCost / systemsCount),
        controllers,
        totalMins,
        baseCost: Math.round(baseCost),
        passUsedMins,
        passSaved: Math.round(passSaved),
        afterPassCost: Math.round(afterPassCost),
        discRate,
        discSaved: Math.round(discSaved),
        finalCost,
        hhFinal,
        peakFinal,
        hhHourly,
        peakHourly,
        hhSliceCost: Math.round(hhSliceCost),
        peakSliceCost: Math.round(peakSliceCost),
        hhHours: hhBlocks / 4,
        peakHours: peakBlocks / 4
      };
    }

    function est(phoneForDiscount = bk.phone, hour = bk.h) {
      const info = estBreakdown(hour, phoneForDiscount);
      return info.finalCost;

    function confirmBook(pay) {
      const rawP = ($("#bp")?.value || bk.phone || S.authSession?.phone || "").trim().replace(/\D/g, "");
      const p = rawP.length >= 10 ? rawP.slice(-10) : rawP;
      const existingCust = p ? S.cust[p] : null;
      const n = ($("#bn")?.value || bk.name || existingCust?.n || "").trim().slice(0, 40);
      const pinInput = ($("#bpin")?.value || bk.pin || "0000").trim() || "0000";
      bk.name = n;
      bk.phone = p;
      bk.pin = pinInput;

      if (!/^\d{10}$/.test(p)) {
        bookNotice = "⚠️ Please enter a 10-digit mobile number (e.g. 9820011223 or 9819397166) to confirm your booking.";
        render();
        return toast(bookNotice);
      }
      if (!n) {
        bookNotice = "⚠️ Please enter your name in the Name box above.";
        render();
        return toast(bookNotice);
      }

      if (bk.h == null) {
        applyBookingTimeWindow(bk.startTime || "13:00", bk.endTime || "15:00", true);
      }
      const systemsCount = getSelectedSystemsCount();
      const availCount = getAvailableRigsInWindow(bk.ty, bk.h, bk.d);
      if (availCount < systemsCount) {
        return toast(
          availCount < 1
            ? "Sorry, all stations of this type are already booked during that time window."
            : `Only ${availCount} ${bk.ty.toUpperCase()} station(s) are free during that window (you selected ${systemsCount} systems).`
        );
      }

      let c = S.cust[p];
      if (!c) {
        if (!/^\d{4,6}$/.test(pinInput)) {
          return toast("Set a 4 to 6-digit PIN for your new player profile.");
        }
        c = S.cust[p] = createBlankCustomer(n, pinInput, p);
        CafeBridge.enqueueMemberUpsert(p);
      }

      const currentDayStr = day();
      const sH = Number(bk.h);
      const eH = sH + Number(bk.d);
      const isStationBusyInWindow = (stId) => {
        const altId = stId.startsWith("PS5-") ? stId.replace("PS5-", "PS-") : stId.replace("PS-", "PS5-");
        return S.book.some((b) => b.day === currentDayStr && (b.stationId === stId || b.stationId === altId) && Math.max(sH, Number(b.h)) < Math.min(eH, Number(b.h) + Number(b.d)));
      };

      const explicitRigs = Array.isArray(bk.multiRigs) && bk.multiRigs.length > 0
        ? [...bk.multiRigs]
        : (bk.prefRig && bk.prefRig !== "ANY" ? [bk.prefRig] : []);

      for (const reqRig of explicitRigs) {
        if (isStationBusyInWindow(reqRig)) {
          return toast(`Station ${reqRig} is already reserved during ${fmtSlotTime(sH)} – ${fmtSlotTime(eH)}. Pick another station or ANY.`);
        }
      }

      const assignedConsoles = [...explicitRigs];
      if (assignedConsoles.length < systemsCount) {
        if (bk.ty === "vr") {
          while (assignedConsoles.length < systemsCount) assignedConsoles.push("VR-1");
        } else {
          const candidateRigs = RIGS.filter((r) => r[1] === bk.ty).map((r) => r[0]);
          const freeIdle = candidateRigs.filter((rId) => !assignedConsoles.includes(rId) && !isStationBusyInWindow(rId) && !getActiveRigSession(rId));
          const freeAny = candidateRigs.filter((rId) => !assignedConsoles.includes(rId) && !isStationBusyInWindow(rId));
          const pool = [...freeIdle, ...freeAny.filter((rId) => !freeIdle.includes(rId))];
          for (const rId of pool) {
            if (assignedConsoles.length >= systemsCount) break;
            assignedConsoles.push(rId);
          }
          while (assignedConsoles.length < systemsCount) {
            assignedConsoles.push(bk.ty === "ps" ? "PS5-1" : bk.ty === "sim" ? "SIM-1" : "PC-1");
          }
        }
      }

      const tObj = tierObjOf(c);
      const finalEst = Math.round(est(p));

    function calcCafeCartTotals() {
      let subtotal = 0;
      const lines = [];
      for (const [itemId, qty] of Object.entries(cafeOrder.cart)) {
        if (qty <= 0) continue;
        const item = CAFE_MENU.find((m) => m.id === itemId);
        if (item) {
          subtotal += item.price * qty;
          lines.push({ item, qty, lineTotal: item.price * qty });
        }
      }
      const c = (cafeOrder.applyDisc && cafeOrder.phone) ? S.cust[cafeOrder.phone] : null;
      const tObj = (cafeOrder.applyDisc && c) ? tierObjOf(c) : TIERS[0];
      const hasWheelCoupon = Boolean(cafeOrder.applyDisc && c && (c.cp || 0) > 0);
      const discRate = cafeOrder.applyDisc ? (hasWheelCoupon ? 0.20 : tObj.foodDisc) : 0;
      const discLabel = !cafeOrder.applyDisc
        ? "Standard Price (No Auto-Discount)"
        : hasWheelCoupon
        ? "20% Wheel Cooler Coupon"
        : tObj.foodDisc > 0
        ? `${tObj.name} (${Math.round(tObj.foodDisc * 100)}% Cooler Perk)`
        : "Standard Price (0% Off)";
      const discAmt = Math.round(subtotal * discRate);
      return {
        lines,
        subtotal,
        discAmt,
        total: Math.max(0, subtotal - discAmt),
        discLabel,
        hasWheelCoupon,
        customer: c
      };
    }

        t: new Date(now()).toISOString(),

      render();

    function drawWheel() {
      const cv = $("#wheel");
      if (!cv) return;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const size = 400;
      if (cv.width !== size * dpr) {
        cv.width = size * dpr;
        cv.height = size * dpr;
      }
      const x = cv.getContext("2d");
      x.save();
      x.scale(dpr, dpr);
      x.clearRect(0, 0, size, size);

      const n = WH.length;
      const a = (2 * Math.PI) / n;
      WH.forEach((w, i) => {
        x.beginPath();
        x.moveTo(200, 200);
        x.arc(200, 200, 196, -Math.PI / 2 + i * a, -Math.PI / 2 + (i + 1) * a);
        x.closePath();
        x.fillStyle = w.col;
        x.fill();
        x.save();
        x.translate(200, 200);
        x.rotate(-Math.PI / 2 + (i + 0.5) * a);
        x.fillStyle = "#ffffff";
        x.font = "bold 16px system-ui, sans-serif";
        x.textAlign = "right";
        x.fillText(w.l, 184, 5);
        x.restore();
      });

      x.beginPath();
      x.arc(200, 200, 26, 0, 2 * Math.PI);
      x.fillStyle = "#06080d";
      x.fill();
      x.lineWidth = 3;
      x.strokeStyle = "#ff6b00";
      x.stroke();
      x.restore();
    }

    function spin() {
      const targetPhone = cur;
      const c = curPinVerified ? S.cust[targetPhone] : null;
      if (spinning || !c || c.sp < 1) return;

      const dynSlices = getWheelDynamicOdds(c).filter((w) => w.livePct > 0);
      const tot = dynSlices.reduce((a, w) => a + w.livePct, 0);
      let r = secureRandom() * tot;
      const picked = dynSlices.find((item) => (r -= item.livePct) < 0) || dynSlices[dynSlices.length - 1];
      const i = WH.findIndex((x) => x.l === picked.l);
      const w = WH[i >= 0 ? i : WH.length - 1];
      const mid = ((i + 0.5) * 360) / WH.length;

      wr += 1800 + ((360 - mid - (wr % 360) + 720) % 360);
      spinning = true;
      c.sp--;
      save();

      const sb = $("#sb");

      const wheelEl = $("#wheel");

      setTimeout(() => {

            recordRewardSpend(w.bucket, w.hardCost, w.perceivedVal);

    function computeSmartChange(amount, availableNotes = null) {
      let remaining = Math.max(0, Math.round(Number(amount) || 0));
      if (remaining === 0) {
        return { changeAmt: 0, breakdown: [], formatted: "Exact Cash (No Change Required)", shortfall: 0 };
      }

      const cd = getCashDrawerState();
      const avail = availableNotes ? { ...availableNotes } : { ...(cd.notes || {}) };
      const breakdown = [];

      for (const d of INR_DENOMINATIONS) {
        if (remaining >= d.val) {
          const needed = Math.floor(remaining / d.val);
          const inDrawer = Math.max(0, Number(avail[d.val]) || 0);
          const toUse = Math.min(needed, inDrawer);
          if (toUse > 0) {
            breakdown.push({ val: d.val, count: toUse, subtotal: toUse * d.val });
            remaining -= toUse * d.val;
            avail[d.val] -= toUse;
          }
        }
      }

      // If there is still a shortfall due to lack of drawer notes, compute unconstrained optimal breakdown as recommendation
      let shortfall = remaining;
      let unconstrained = [];
      if (shortfall > 0) {
        let uncRem = Math.round(amount);
        for (const d of INR_DENOMINATIONS) {
          if (uncRem >= d.val) {
            const count = Math.floor(uncRem / d.val);
            if (count > 0) {
              unconstrained.push({ val: d.val, count, subtotal: count * d.val });
              uncRem -= count * d.val;
            }
          }
        }
      }

      const activeBreakdown = shortfall === 0 ? breakdown : unconstrained;
      const formatted = activeBreakdown.map(b => `${b.count}× ₹${b.val}`).join(" + ") || "None";

      return {
        changeAmt: Math.round(amount),
        breakdown,
        shortfall,
        formatted: shortfall > 0 ? `${formatted} (⚠️ Drawer shortage of ₹${shortfall} in small notes)` : formatted
      };
    }

    function excelDetectCategory(tinStr, toutStr, forceGroup = false) {
      if (forceGroup) return "Group";
      if (!tinStr || !toutStr) return "Standard";
      const tin = parseTimeToHours(tinStr);
      const tout = parseTimeToHours(toutStr);
      if (tin >= 10.0 && tout <= 14.0 && tout > tin) {
        return "Happy Hr";
      }
      if ((tout <= 10.0 || tin >= 14.0) && (tout >= tin || tout + 24 >= tin)) {
        return "Standard";
      }
      return "Split Time";
    }

    function excelCalcGameCharges(consoleId, tinStr, toutStr, category, controllers = 1) {
      if (!tinStr || !toutStr) return { gameCharges: 0, totalHr: 0, totalHrRounded: 0, hhHours: 0, stdHours: 0 };
      const tin = parseTimeToHours(tinStr);
      const tout = parseTimeToHours(toutStr);
      const rawDiff = ((tout - tin) % 24 + 24) % 24 || 24;
      const totalHr = Number(rawDiff.toFixed(4));
      // Excel exact 30-min block rounding: ROUND(MOD(F2-E2,1)*24*2,0)/2
      const totalHrRounded = Math.round(totalHr * 2) / 2.0;

      const hhStart = 10.0;
      const hhEnd = 14.0;
      const rawHhOverlap = Math.max(0.0, Math.min(tout, hhEnd) - Math.max(tin, hhStart));
      let hhHours = Math.round(rawHhOverlap * 2) / 2.0;
      let stdHours = Math.max(0.0, totalHrRounded - hhHours);
      if (category === "Happy Hr") {
        hhHours = totalHrRounded;
        stdHours = 0.0;
      } else if (category === "Standard") {
        hhHours = 0.0;
        stdHours = totalHrRounded;
      }

      const cUpper = String(consoleId || "").trim().toUpperCase();
      const ctrl = Math.max(1, Number(controllers) || 1);

      let charges = 0;
      if (cUpper.startsWith("PS")) {
        if (category === "Group") {
          const intHr = Math.floor(totalHrRounded);
          const fracHr = totalHrRounded - intHr;
          charges = (intHr * EXCEL_PRICING.group.psRate + fracHr * EXCEL_PRICING.standard.psRate) * ctrl;
        } else {
          charges = (hhHours * EXCEL_PRICING.happyHr.psRate + stdHours * EXCEL_PRICING.standard.psRate) * ctrl;
        }
      } else if (cUpper.startsWith("PC")) {
        if (category === "Group") {
          charges = totalHrRounded * EXCEL_PRICING.group.pcRate;
        } else {
          charges = hhHours * EXCEL_PRICING.happyHr.pcRate + stdHours * EXCEL_PRICING.standard.pcRate;
        }
      } else if (cUpper.startsWith("SIM")) {
        charges = hhHours * 150 + stdHours * 200;
      } else {
        charges = hhHours * 200 + stdHours * 250;
      }

      return {
        gameCharges: Math.round(charges),
        totalHr,
        totalHrRounded,
        hhHours,
        stdHours
      };
    }

    function excelGetCustomerSummary(customerName, phone) {
      const cName = String(customerName || "").trim().toLowerCase();
      const pClean = String(phone || "").trim();
      const logs = (S.masterLog || []).filter(item => {
        const matchName = (item.customer || "").trim().toLowerCase() === cName;
        if (!matchName) return false;
        const itemPhone = String(item.phone || "").trim();
        if (pClean === "No Phone") return !itemPhone;
        if (pClean) return itemPhone === pClean;
        return true;
      });

      const visits = logs.length;
      const hoursPlayed = Number(logs.reduce((sum, item) => sum + (Number(item.totalHr) || 0), 0).toFixed(2));
      const gameSpend = Math.round(logs.reduce((sum, item) => sum + (Number(item.gameCharges) || 0), 0));
      const snacksSpend = Math.round(logs.reduce((sum, item) => sum + (Number(item.snacks) || 0), 0));
      const lifetimeSpend = gameSpend + snacksSpend;
      const walletSpend = Math.round(logs.reduce((sum, item) => sum + (Number(item.wallet) || 0), 0));

      const topups = (S.walletTopUps || []).filter(item => (item.customer || "").trim().toLowerCase() === cName);
      const totalDeposited = Math.round(topups.reduce((sum, item) => sum + (Number(item.amount) || 0) + (Number(item.bonusAmount) || 0), 0));
      const liveWalletBalance = totalDeposited - walletSpend;

      return {
        name: customerName,
        phone: phone || "No Phone",
        visits,
        hoursPlayed,
        gameSpend,
        snacksSpend,
        lifetimeSpend,
        walletSpend,
        totalDeposited,
        liveWalletBalance
      };
    }

    function excelGetDailyDashboard(dateStr) {
      const targetDate = String(dateStr || "2026-03-18").trim();
      const dayLogs = (S.masterLog || []).filter(item => String(item.date || "").trim() === targetDate);

      const totalBilled = Math.round(dayLogs.reduce((sum, item) => sum + (Number(item.totalBill) || 0), 0));
      const totalCash = Math.round(dayLogs.reduce((sum, item) => sum + (Number(item.cash) || 0), 0));
      const totalUpi = Math.round(dayLogs.reduce((sum, item) => sum + (Number(item.upi) || 0), 0));
      const totalWallet = Math.round(dayLogs.reduce((sum, item) => sum + (Number(item.wallet) || 0), 0));
      const totalCashGiven = Math.round(dayLogs.reduce((sum, item) => sum + (Number(item.cashGiven) || 0), 0));
      const totalChangeToReturn = Math.round(dayLogs.reduce((sum, item) => sum + (Number(item.changeToReturn) || 0), 0));

      const sessionsCompleted = dayLogs.filter(item => Boolean(item.timeOut)).length;
      const sessionsPending = dayLogs.filter(item => Boolean(item.timeIn) && !item.timeOut).length;
      const pcHours = Number(dayLogs.filter(item => String(item.console || "").startsWith("PC")).reduce((sum, item) => sum + (Number(item.totalHr) || 0), 0).toFixed(2));
      const psHours = Number(dayLogs.filter(item => String(item.console || "").startsWith("PS")).reduce((sum, item) => sum + (Number(item.totalHr) || 0), 0).toFixed(2));

      const openingFloat = Number(S.cashDrawer?.openingFloat) || 2000;
      const payouts = Number(S.cashDrawer?.cashPayouts) || 0;
      const netCashInTill = openingFloat + totalCash - payouts;

      return {
        date: targetDate,
        totalBilled,
        totalCash,
        totalUpi,
        totalWallet,
        totalCashGiven,
        totalChangeToReturn,
        netCashInTill,
        sessionsCompleted,
        sessionsPending,
        pcHours,
        psHours
      };
    }

    function excelGetMonthlySummary(monthKeyStr) {
      const targetMonth = String(monthKeyStr || "2026-03").slice(0, 7);
      const monthLogs = (S.masterLog || []).filter(item => String(item.date || "").slice(0, 7) === targetMonth);

      return {
        month: targetMonth,

        fbRevenue,
        totalOperatingExpenses,
        trueNetProfit
      };
    }

    function start() {
      if (!sel || S.rigs[sel]) return;
      const p = ($("#sp")?.value || "").trim();
      if (!/^\d{10}$/.test(p)) return toast("10-digit phone needed.");

      const existingRig = Object.entries(S.rigs).find(([, r]) => r.c === p);
      if (existingRig) {
        return toast(`Player is already active on ${existingRig[0]}.`);
      }

      let c = S.cust[p];
      if (!c) {
        const n = ($("#sn")?.value || "").trim().slice(0, 40);
        if (!n) return toast("New player: add a name.");
        c = S.cust[p] = createBlankCustomer(n, "0000");
      }

      const k = sel.startsWith("PS5")
        ? Math.min(4, Math.max(1, Math.round(Number($("#sk")?.value) || 2)))
        : 1;
      const vr2 = sel.startsWith("SIM") ? Boolean($("#svr2")?.checked) : false;
      const grp = sel.startsWith("PC") ? Boolean($("#sgrp")?.checked) : k >= 4;

      let startTs = now();
      let endTs = null;
      const stVal = ($("#staff-start-time")?.value || "").trim();
      const etVal = ($("#staff-end-time")?.value || "").trim();
      if (/^\d{2}:\d{2}$/.test(stVal)) {
        const [sh, sm] = stVal.split(":").map(Number);
        const sd = new Date(now());
        sd.setHours(sh, sm, 0, 0);
        startTs = +sd;
      }
      if (/^\d{2}:\d{2}$/.test(etVal)) {
        const [eh, em] = etVal.split(":").map(Number);
        const ed = new Date(startTs);
        ed.setHours(eh, em, 0, 0);
        if (+ed <= startTs) ed.setDate(ed.getDate() + 1);
        endTs = +ed;
      }
      DB.startSession(sel, { c: p, s: startTs, e: endTs, k, vr2, grp, sn: 0, items: [], prepaid: 0 });
      render();
    }

    function seatBooking(bookingId) {
      const b = S.book.find((item) => item.id === bookingId && !item.seated);
      if (!b) return toast("Booking not found or already seated.");

      const freeRig = RIGS.find((r) => r[1] === b.ty && !S.rigs[r[0]]);
      if (!freeRig) return toast(`No free ${b.ty.toUpperCase()} station right now.`);

      const rigId = freeRig[0];
      S.rigs[rigId] = {
        c: b.p,
        s: now(),
        k: b.ty === "ps" ? Math.min(4, Math.max(1, b.k || 1)) : 1,
        vr2: Boolean(b.vr2),
        grp: Boolean(b.grp),
        sn: 0,
        items: [],
        prepaid: b.prepaid || 0
      };
      b.seated = true;
      sel = rigId;
      save();
      toast(`Seated ${b.n} on ${rigId}.`);
      render();
    }

    function end(m) {
      if (!sel || !S.rigs[sel]) return;
      const s = S.rigs[sel];
      const c = S.cust[s.c];
      const b = bill(sel);

      let paid = b.t;
      if (m === "wallet") {
        paid = Math.min(c.w, b.t);
        c.w -= paid;
      }
      const due = b.t - paid;

      c.pass = Math.max(0, (c.pass || 0) - b.u);
      if (b.usedWheelCoupon) {
        c.cp = Math.max(0, (c.cp || 0) - 1);
      }

      c.v++;
      c.h += b.m / 60;
      const unlockedNotes = [];

      const spinsEarned = Math.min(3, Math.floor(b.m / 60));
      if (spinsEarned > 0) {
        c.sp = (c.sp || 0) + spinsEarned;
        unlockedNotes.push(`+${spinsEarned} Spin(s)`);
      }

      if (b.m >= 180) {
        c.pass = (c.pass || 0) + 15;
        unlockedNotes.push("+15m HH Pass (3h Milestone)");
      }

      c.wkMins = (c.wkMins || 0) + b.m;
      let cratesEarned = 0;
      while (c.wkMins >= 300) {
        c.wkMins -= 300;
        cratesEarned++;
      }
      if (b.m >= 300 && cratesEarned === 0) {
        cratesEarned = 1;
      }
      if (cratesEarned > 0) {
        c.drops = (c.drops || 0) + cratesEarned;
        unlockedNotes.push(`+${cratesEarned} VoidZone Drop Crate (5h Milestone!)`);
      }

      const currentDay = day();
      const last = c.last;
      const y = day(now() - 864e5);
      if (last !== currentDay) {
        c.st = last === y ? (c.st || 0) + 1 : (c.sh || 0) > 0 ? (c.sh--, (c.st || 0) + 1) : 1;
        c.last = currentDay;

        if (c.st === 3) {
          c.pass = (c.pass || 0) + 15;
          unlockedNotes.push("Day 3 Streak: +15m Bonus HH Pass!");
        } else if (c.st === 5) {
          c.sp = (c.sp || 0) + 1;
          unlockedNotes.push("Day 5 Streak: +1 Free Cyber Spin!");
        } else if (c.st >= 7) {
          c.drops = (c.drops || 0) + 1;
          c.weeksCompleted = (c.weeksCompleted || 0) + 1;
          c.st = 0;
          if (S.economy.spinReserve >= 50 && S.given + 50 <= cap()) {
            c.w += 50;
            recordRewardSpend("spin", 50, 50);
            unlockedNotes.push("Day 7 Weekly Streak Complete: +1 Drop Crate & +₹50 Wallet!");
          } else {
            c.pass = (c.pass || 0) + 60;
            recordRewardSpend("zero", 0, 80);
            unlockedNotes.push("Day 7 Weekly Streak Complete: +1 Drop Crate & +60m Happy-Hr Pass!");
          }
        }
      }

      const collectedRatio = b.grossTotal > 0 ? (paid + b.prepaidUsed) / b.grossTotal : 0;
      accrueProfitToEconomy(b.netPlay * collectedRatio, b.sn * collectedRatio, 0);

      const endIsoDate = new Date(now()).toISOString().slice(0, 10);
      const endTxId = excelGenerateNextTxId(endIsoDate);
      const sD = new Date(s.s);
      const eD = new Date(s.e && s.e > s.s ? s.e : now());
      const tInStr = `${String(sD.getHours()).padStart(2, "0")}:${String(sD.getMinutes()).padStart(2, "0")}:00`;
      const tOutStr = `${String(eD.getHours()).padStart(2, "0")}:${String(eD.getMinutes()).padStart(2, "0")}:00`;
      const mlEntry = {
        txId: endTxId,
        date: endIsoDate,
        customer: c.n,
        phone: s.c,
        timeIn: tInStr,
        timeOut: tOutStr,
        totalHr: Number((b.m / 60).toFixed(2)),
        console: String(sel).replace("PS5-", "PS-"),
        category: s.grp ? "Group" : excelDetectCategory(tInStr, tOutStr),
        controllers: String(sel).startsWith("PS") ? (s.k || 1) : 0,
        gameCharges: b.netPlay,
        snacks: b.sn,
        totalBill: b.grossTotal,
        cash: m === "cash" ? paid : 0,
        upi: m === "UPI" ? paid : 0,
        wallet: m === "wallet" ? paid : 0,
        totalReceived: paid + (b.prepaidUsed || 0),
        balanceDue: due,
        cashGiven: m === "cash" ? paid : 0,
        changeToReturn: 0,
        status: due > 0 ? "⏳ Partial" : "✅ Paid"
      };
      if (!Array.isArray(S.masterLog)) S.masterLog = [];
      S.masterLog.push(mlEntry);
      fetch("/api/master-log", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-VZ-Pin": staffRole === "owner" ? "9999" : "1234" },
        body: JSON.stringify(mlEntry)
      }).catch(() => {});

      S.log.push({
        t: new Date(now()).toISOString(),
        id: sel,
        n: c.n,
        p: s.c,
        m: b.m,
        playRev: b.netPlay,
        foodRev: b.sn,
        total: b.grossTotal,
        pay: m,
        due
      });
      if (S.log.length > MAX_LOG_ENTRIES) {
        S.log = S.log.slice(-MAX_LOG_ENTRIES);
      }

      clearActiveRigSession(sel);
      sel = null;
      save();
      const milestoneStr = unlockedNotes.length ? ` | Unlocked: ${unlockedNotes.join(", ")}` : "";
      toast((due ? `Closed (${rs(due)} due)` : "Session closed") + milestoneStr);
      render();
    }

    function topup() {
      const p = ($("#tp")?.value || "").trim();
      const rawAmt = Number($("#ta")?.value);
      const a = Math.round(rawAmt);
      if (!/^\d{10}$/.test(p) || !Number.isFinite(a) || a < 10 || a > 50000) {
        return toast("Enter a 10-digit phone and amount between ₹10 and ₹50,000.");
      }
      let c = S.cust[p];
      if (!c) {
        const n = ($("#tn")?.value || "").trim().slice(0, 40);
        const pinVal = ($("#tpin")?.value || "").trim();
        if (!n) return toast("New player: add a name.");
        c = S.cust[p] = createBlankCustomer(n, pinVal, p);
        CafeBridge.enqueueMemberUpsert(p);
      }
      DB.updateBalance(p, a, "TOPUP", "desk", "Staff Desk Wallet Top-Up");
      toast(`${rs(a)} added for ${c.n} (@${c.member_account}) & queued to iCafeCloud!`);
      render();
    }

    function buyMembershipPass(payMethod) {
      const p = ($("#mp-phone")?.value || "").trim();
      const tierId = $("#mp-tier")?.value || "silver";
      if (!/^\d{10}$/.test(p)) return toast("Enter a valid 10-digit customer phone.");

      const c = S.cust[p];
      if (!c) return toast("Customer not found. Register them via Top-up or Session Start first.");

      const tObj = TIERS.find((t) => t.id === tierId);
      if (!tObj || tObj.passPrice <= 0) return;

      if (payMethod === "wallet") {
        if (c.w < tObj.passPrice) {
          return toast(`Wallet has ${rs(c.w)}, need ${rs(tObj.passPrice)} for ${tObj.name}.`);
        }
        c.w -= tObj.passPrice;
      }

      c.passTier = tObj.id;
      c.passExp = now() + 30 * 864e5;
      accrueProfitToEconomy(0, 0, tObj.passPrice);

      if (tObj.id === "gold") {
        c.sp = (c.sp || 0) + 1;
      } else if (tObj.id === "radiant") {
        c.drops = (c.drops || 0) + 1;
        c.sp = (c.sp || 0) + 1;
      }

      save();
      toast(
        `Activated ${tObj.name} Pass (30d) for ${c.n} via ${payMethod}!` +
          (tObj.id === "radiant" ? " (+1 Drop Crate & +1 Spin granted!)" : "")
      );
      render();
    }

    function sanitizeCsvCell(val) {
      let str = String(val ?? "");
      if (/^[=+\-@\t\r]/.test(str)) {
        str = "'" + str;
      }
      if (/[",\n\r]/.test(str)) {
        return '"' + str.replace(/"/g, '""') + '"';
      }
      return str;
    }

    function buildCsvString() {
      const header = "time,station,player,phone,minutes,play_inr,cooler_inr,total_bill,paid_by,due";
      const rows = S.log.map((l) =>
        [l.t, l.id, l.n, l.p, l.m, l.playRev ?? l.total, l.foodRev || 0, l.total, l.pay, l.due]
          .map(sanitizeCsvCell)
          .join(",")
      );
      return [header, ...rows].join("\n");
    }

    function showCsv() {
      const container = $("#csv");
      if (!container) return;
      container.innerHTML = "";
      const ta = document.createElement("textarea");
      ta.readOnly = true;
      ta.value = buildCsvString();
      container.appendChild(ta);
    }

    function downloadCsv() {
      const csvText = buildCsvString();
      const blob = new Blob([csvText], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `voidzone-mazgaon-sessions-${new Date(now()).toISOString().slice(0, 10)}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      toast("Downloaded VoidZone Mazgaon session log CSV.");
    }

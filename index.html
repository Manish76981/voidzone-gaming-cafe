          S.deskBookingDraft[field] = el.value;
        }
        render();
        return;
      } else if (action === "denom-input") {
        const val = Number(el.getAttribute("data-val"));
        const cd = getCashDrawerState();
        cd.notes[val] = Math.max(0, Number(el.value) || 0);
        save();
        render();
        return;
      } else if (action === "calc-input") {
        const field = el.getAttribute("data-field");
        if (!S.cashCalcDraft) S.cashCalcDraft = { bill: 160, tender: 500 };
        S.cashCalcDraft[field] = Math.max(0, Number(el.value) || 0);
        render();
        return;
      } else if (action === "ml-filter-date") {
        S.mlFilterDate = el.value || "";
        render();
        return;
      } else if (action === "ml-filter-query") {
        S.mlFilterQuery = el.value || "";
        render();
        return;
      } else if (action === "daily-date-picker") {
        S.dailyReportDate = el.value;
        save();
        render();
        return;
      } else if (action === "monthly-date-picker") {
        S.monthlyReportDate = el.value;
        save();
        render();
        return;
      } else if (action === "master-input") {
        const field = el.getAttribute("data-field");
        if (!S.masterFormDraft) S.masterFormDraft = {};
        S.masterFormDraft[field] = el.value;
        save();
        render();
        return;
      } else if (action === "book-apply-disc") {
        bk.applyDisc = Boolean(el.checked);
        render();
        return;
      } else if (action === "cafe-apply-disc") {
        cafeOrder.applyDisc = Boolean(el.checked);
        render();
        return;
      } else if (action === "toggle-rig-disc") {
        const s = getActiveRigSession(sel);
        if (s) {
          s.applyDisc = Boolean(el.checked);
          save();
          render();
        }
        return;
      }

      if (action === "pod-time-part") {
        const which = el.getAttribute("data-which");
        const part = el.getAttribute("data-part");
        const isEnd = which === "end";
        const curH = isEnd ? (bk.h ?? 13) + (bk.d || 2) : (bk.h ?? 13);
        const p = hValToParts(curH);
        const nextHr12 = part === "hr" ? Number(el.value) : p.hr12;
        const nextMin = part === "min" ? Number(el.value) : p.mins;
        const nextOpH = partsToOpHour(nextHr12, nextMin, p.ampm, isEnd);
        if (isEnd) {
          const sH = bk.h ?? 13;
          const eH = nextOpH <= sH ? Math.min(26, sH + 0.5) : nextOpH;
          applyBookingTimeWindow(hValToTimeStr(sH), hValToTimeStr(eH), false);
        } else {
          const sH = nextOpH;
          let eH = (bk.h ?? 13) + (bk.d || 2);
          if (eH <= sH) eH = Math.min(26, sH + (bk.d || 2));
          applyBookingTimeWindow(hValToTimeStr(sH), hValToTimeStr(eH), false);
        }
        render();
      } else if (action === "book-hours") {
        bk.d = Math.min(12, Math.max(0.25, Number(el.value) || 2));
        if (bk.h != null) {
          bk.startTime = hValToTimeStr(bk.h);
          bk.endTime = hValToTimeStr(bk.h + bk.d);
        }
        render();
      } else if (action === "book-qty") {
        const newQty = Math.min(17, Math.max(1, Number(el.value) || 1));
        bk.qty = newQty;
        if (Array.isArray(bk.multiRigs) && bk.multiRigs.length > newQty) {
          bk.multiRigs = bk.multiRigs.slice(0, newQty);
          bk.prefRig = bk.multiRigs[0] || "ANY";
        } else if (newQty > 1 && Array.isArray(bk.multiRigs) && bk.multiRigs.length <= 1) {
          bk.multiRigs = [];
          bk.prefRig = "ANY";
        }
        if (bk.ty === "pc" && newQty >= 10) bk.grp = true;
        render();
      } else if (action === "home-calc-type") {
        bk.ty = el.value;
        render();
      } else if (action === "book-filter-hour") {
        bk.filterH = el.value;
        render();
      } else if (action === "book-custom-time" || action === "home-start-time") {
        const startVal = el.value;
        const endVal = $("#book-end-time")?.value || $("#home-end-time")?.value || bk.endTime;
        applyBookingTimeWindow(startVal, endVal, false);
        render();
      } else if (action === "book-end-time" || action === "home-end-time") {
        const startVal = $("#book-custom-time")?.value || $("#home-start-time")?.value || bk.startTime;
        const endVal = el.value;
        applyBookingTimeWindow(startVal, endVal, false);
        render();
      } else if (action === "book-controllers") {
        bk.k = Math.min(4, Math.max(1, Number(el.value) || 2));
        render();
      } else if (action === "book-vr2") {
        bk.vr2 = Boolean(el.checked);
        render();
      } else if (action === "book-grp") {
        bk.grp = Boolean(el.checked);
        render();
      } else if (action === "cafe-target") {
        cafeOrder.rigId = el.value;
        render();
      } else if (action === "service-ping-rig") {
        servicePingRig = el.value;
      } else if (action === "party-branch") {
        partyCfg.branch = el.value;
        render();
      } else if (action === "party-guests") {
        partyCfg.guests = Number(el.value) || 10;
        render();
      } else if (action === "party-hrs") {
        partyCfg.hrs = Number(el.value) || 3;
        render();
      } else if (action === "party-chiller") {
        partyCfg.chiller = Boolean(el.checked);
        render();
      } else if (action === "rev-edit") {
        const field = el.getAttribute("data-field");
        if (field && field in S.economy) {
          S.economy[field] = Math.max(0, Number(el.value) || 0);
          recalcEconomyBounds();
          save();
          render();
        }
      } else if (action === "opex-edit") {
        const field = el.getAttribute("data-field");
        if (field && field in S.opex) {
          S.opex[field] = Math.max(0, Number(el.value) || 0);
          recalcEconomyBounds();
          save();
          render();
        }
      } else if (action === "cfg-pct") {
        S.cfg.pct = clampRewardPct(el.value);
        recalcEconomyBounds();
        save();
        render();
      } else if (action === "cfg-skin-quota") {
        const q = Math.min(10, Math.max(0, Math.floor(Number(el.value) || 0)));
        S.monthlyDropPool.skinsRemaining = q;
        S.monthlyDropPool.skinsQuota = Math.max(S.monthlyDropPool.skinsQuota, q);
        save();
        render();
      }
    });

    document.addEventListener("input", (e) => {

      if (e.target.id === "bp") {
        bk.phone = e.target.value.trim();
        const cardWrap = $("#book-est-card-wrap");
        if (cardWrap) {
          cardWrap.innerHTML = renderBookEstimateCard();
        }
        const c = S.cust[bk.phone];
        if (c && !bk.name) {
          bk.name = c.n;
          const bnEl = $("#bn");
          if (bnEl && !bnEl.value) bnEl.value = c.n;
        }
        const tObj = tierObjOf(c);
        const curEst = estBreakdown(bk.h, bk.phone);
        const walletBtn = $("#book-btn-wallet");
        const deskBtn = $("#book-btn-desk");
        if (walletBtn) {
          walletBtn.textContent = `Pay from wallet${bk.h != null ? ` (${rs(curEst.finalCost)})` : ""}`;
        }
        if (deskBtn) {
          deskBtn.textContent = `Pay at desk (${bk.h != null ? `Est. ${rs(curEst.finalCost)} · ` : ""}held ${tObj.holdMins} min)`;
        }
      } else if (e.target.id === "bn") {
        bk.name = e.target.value;
      } else if (e.target.id === "bpin") {
        bk.pin = e.target.value;
      } else if (e.target.id === "cafe-phone") {
        cafeOrder.phone = e.target.value.trim();
        if (cafeOrder.phone.length === 10 || cafeOrder.phone.length === 0) {
          render();
          const inputEl = $("#cafe-phone");
          if (inputEl) {
            inputEl.focus();
            inputEl.setSelectionRange(inputEl.value.length, inputEl.value.length);
          }
        }
      } else if (e.target.getAttribute && e.target.getAttribute("data-action") === "ml-filter-query") {
        const pos = e.target.selectionStart || e.target.value.length;
        S.mlFilterQuery = e.target.value;
        render();
        const qEl = document.querySelector('[data-action="ml-filter-query"]');
        if (qEl) {
          qEl.focus();
          try { qEl.setSelectionRange(pos, pos); } catch (_) {}
        }
      }
    });

    
    document.addEventListener("keydown", (e) => {
      if (e.target && e.target.closest && e.target.closest("#nav.vz-frosted-tabbar")) {
        if (e.key === "ArrowRight" || e.key === "ArrowLeft" || e.key === "Home" || e.key === "End") {
          e.preventDefault && e.preventDefault();
          const tabIds = getAuthorizedNavTabIds();
          if (!tabIds.length) return;
          const curIdx = Math.max(0, tabIds.indexOf(view));
          let nextIdx = curIdx;
          if (e.key === "ArrowRight") nextIdx = Math.min(tabIds.length - 1, curIdx + 1);
          else if (e.key === "ArrowLeft") nextIdx = Math.max(0, curIdx - 1);
          else if (e.key === "Home") nextIdx = 0;
          else if (e.key === "End") nextIdx = tabIds.length - 1;
          const nextView = tabIds[nextIdx];
          if (nextView && nextView !== view) {
            go(nextView);
            const nextBtn = document.querySelector(`#nav button[data-view="${nextView}"]`);
            if (nextBtn && typeof nextBtn.focus === "function") nextBtn.focus();
          }
          return;
        }
      }
      if (e.altKey && (e.key === "ArrowRight" || e.key === "ArrowLeft")) {
        e.preventDefault && e.preventDefault();
        swipeTab(e.key === "ArrowRight" ? 1 : -1);
        return;
      }
      if ((e.key === "Enter" || e.key === " ") && e.target && (e.target.id === "hdr-logo-home" || (e.target.classList && e.target.classList.contains("logo")))) {
        e.preventDefault && e.preventDefault();
        go("home");
        return;
      }
      if (e.key === "Escape") {
        if (authDrawerOpen || showSqlModal) {
          authDrawerOpen = false;
          showSqlModal = false;
          authNotice = "";
          render();
        }
        return;
      }
      if (e.key !== "Enter") return;
      if (e.target.id === "pin") login();
      if (e.target.id === "si-id" || e.target.id === "si-pin") {
        const siBtn = $('[data-action="submit-signin"]');
        if (siBtn) siBtn.click();
      }
      if (["su-account", "su-phone", "su-name", "su-riot", "su-email", "su-pin"].includes(e.target.id)) {
        const suBtn = $('[data-action="submit-signup"]');
        if (suBtn) suBtn.click();
      }
      if (["bn", "bp", "bpin"].includes(e.target.id)) {
        const bkBtn = $("#book-btn-desk") || $("#book-btn-wallet");
        if (bkBtn) bkBtn.click();
      }
      if (e.target.id === "rp" || e.target.id === "rpin") {
        const lookupBtn = $('[data-action="lookup-rewards"]');
        if (lookupBtn) lookupBtn.click();
      }
    });

    
    // Live ticking stopwatch for PC Trackers and PS Trackers (Sheets 6 & 7)
    setInterval(() => {
      if (view === "staff" && ok) {
        document.querySelectorAll("[data-excel-stopwatch]").forEach((span) => {
          const startMs = Number(span.getAttribute("data-start-ms"));
          if (startMs && startMs > 0) {
            const elapsedSec = Math.max(0, Math.floor((now() - startMs) / 1000));
            const hh = Math.floor(elapsedSec / 3600);
            const mm = Math.floor((elapsedSec % 3600) / 60);
            const ss = elapsedSec % 60;
            span.textContent = `${String(hh).padStart(2, "0")}:${String(mm).padStart(2, "0")}:${String(ss).padStart(2, "0")}`;
          }
        });
      }
    }, 1000);
setInterval(() => {
      if (view === "staff" && ok) {
        checkStaffSessionTimeout();
        if (!ok) {
          render();
          return;
        }
        document.querySelectorAll("[data-rig-timer]").forEach((span) => {
          const rigId = span.getAttribute("data-rig-timer");
          const s = S.rigs[rigId];
          if (s) {
            span.textContent = Math.max(0, Math.floor((now() - s.s) / 6e4)) + " min";
          }
        });
      }
    }, 15000);

    
    window.addEventListener("hashchange", () => {
      const next = location.hash.slice(1);
      const t = VALID_VIEWS.has(next) ? next : "home";
      if (t !== view) go(t);
    });

    (function () {
      const bg = document.createElement("div");
      bg.id = "vz-bg3d";
      bg.className = "vz-spatial-ambient-canvas";
      bg.setAttribute("aria-hidden", "true");
      bg.innerHTML = '<div class="vz-ambient-orb vz-orb-primary"></div><div class="vz-ambient-orb vz-orb-secondary"></div>';
      document.body.prepend(bg);
    })();
    render();
    playIn();
    // Non-blocking initial Edge D1 state hydration when deployed on Cloudflare
    fetch("/api/bookings?date=" + encodeURIComponent(new Date(now()).toISOString().slice(0, 10)))
      .then((r) => (r && r.ok ? r.json() : null))
      .then((data) => {
        if (data && data.ok && Array.isArray(data.bookings) && data.bookings.length > 0) {
          const existingIds = new Set((S.masterLog || []).map((x) => x.txId));
          let added = false;
          data.bookings.forEach((b) => {
            if (b.tx_id && b.tx_id !== "OCCUPIED" && !existingIds.has(b.tx_id)) {
              S.masterLog.push({
                txId: b.tx_id,
                date: b.session_date,
                customer: b.customer_name || "Gamer",
                phone: b.phone || "",
                timeIn: b.time_in || "",
                timeOut: b.time_out || "",
                totalHr: Number(b.total_hr || 0),
                console: b.console_id || "PC-1",
                category: b.category || "Standard",
                controllers: Number(b.controllers || 1),
                gameCharges: Number(b.game_charges ?? b.total_bill ?? 0),
                snacks: Number(b.snacks || 0),
                totalBill: Number(b.total_bill || 0),
                cash: Number(b.cash || 0),
                upi: Number(b.upi || 0),
                wallet: Number(b.wallet || 0),
                totalReceived: Number(b.total_received || 0),
                balanceDue: Number(b.balance_due || 0),
                cashGiven: Number(b.cash_given || 0),
                changeToReturn: Number(b.change_to_return || 0),
                status: b.wallet_status || "✅ Paid"
              });
              added = true;
            }
          });
          if (added) { save(); render(); }
        }
      })
      .catch(() => {});
  })();
  </script>
</body>
</html>
